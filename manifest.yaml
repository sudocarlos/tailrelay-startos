id: tailrelay
title: Tailrelay
version: 0.11.3
release-notes: |-
  ### Changed
  - **Vite** (#132) — bumped from `8.2.2` to `8.3.0` in `webui/frontend/package.json`, bringing faster preload dependency handling, CSS style-tag minification, and support for subpath imports in dynamic import statements
  - **Docs site** (#123) — migrated from Docusaurus to Material for MkDocs; the API reference now renders directly from `docs/openapi.yaml` via the OpenAPI Docs plugin at build time
  - **Go** (#116) — bumped from `1.27.0` to `1.27.1` in Dockerfile, `go.mod`, and CI, taking in fixes to cgo, the compiler, the runtime, and the `net/http` and `os` packages, among others
  - **Node.js** (#116, #125) — bumped from `24.20.0` to `24.21.0` in Dockerfile and CI, which updates root certificates to NSS 3.126 and bundled dependencies to OpenSSL 3.5.8 and Undici 7.29.1
  - **CI version check** (#126, #127, #128, #129, #131) — auto-opens bump PRs for Go, Node, Tailscale, and Vite, embedding release notes and changelog links in each PR body
license: mit
wrapper-repo: "https://github.com/sudocarlos/tailrelay-startos"
upstream-repo: "https://github.com/sudocarlos/tailrelay"
support-site: "https://github.com/sudocarlos/tailrelay/issues"
marketing-site: "https://github.com/sudocarlos/tailrelay"
donation-url: null
build: ["make"]
min-os-version: 0.3.5
description:
  short: Expose local services to your Tailscale network with automatic TLS, HTTP proxies, and TCP relays.
  long: |
    Tailrelay combines Tailscale VPN, Caddy reverse proxy, socat TCP relays, and a Web UI for browser-based management.
    Securely access self-hosted services like BTCPayServer, LND, electrs, and Mempool without Tor.
    Features automatic HTTPS certificates via Tailscale, protocol support for both HTTP/HTTPS proxies and raw TCP relays,
    and backup/restore functionality.
assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md
  docker-images: image.tar
main:
  type: docker
  image: main
  entrypoint: docker_entrypoint.sh
  args: []
  mounts:
    main: /data
    tailscale: /var/lib/tailscale
  io-format: yaml
health-checks:
  web-ui:
    name: Web UI
    success-message: Tailrelay Web UI is ready to be visited in your browser.
    type: script
properties:
  type: script
volumes:
  main:
    type: data
  tailscale:
    type: data
interfaces:
  main:
    name: User Interface
    description: Tailrelay Web UI
    tor-config:
      port-mapping:
        80: "8021"
    lan-config:
      443:
        ssl: true
        internal: 8021
    ui: true
    protocols:
      - tcp
      - http
dependencies: {}
actions: {}
alerts: {}
backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - create
      - /mnt/backup
      - /data
      - /var/lib/tailscale
    mounts:
      BACKUP: /mnt/backup
      main: /data
      tailscale: /var/lib/tailscale
    io-format: yaml
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /data
      - /var/lib/tailscale
    mounts:
      BACKUP: /mnt/backup
      main: /data
      tailscale: /var/lib/tailscale
    io-format: yaml
migrations:
  from:
    "*":
      type: script
      args: ["from"]
  to:
    "*":
      type: script
      args: ["to"]
