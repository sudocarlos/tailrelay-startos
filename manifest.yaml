id: tailrelay
title: Tailrelay
version: 0.11.4
release-notes: |-
  ### Changed
  - **CI** — `frontend`, `backend`, `integration`, and `release` jobs now read `GO_VERSION`/`NODE_VERSION` from the Dockerfile `ARG`s at run time; the hard-coded pins are gone from `ci.yml`, so dependency-bump branches no longer need to touch workflow files (GitHub blocks `GITHUB_TOKEN` commits to `.github/workflows/*`)
  - **Tailscale** (#138) — bumped from `v1.102.4` to `v1.102.5` in Dockerfile, which stops the client from shutting down `tailscaled` when it falls behind on status updates and the connection is closed (common on large tailnets); it reconnects instead and only exits if it cannot reconnect within one minute
  - **Vite** (#147) — bumped from `8.3.0` to `8.3.4` in `webui/frontend/package.json`, collecting four patch releases: a faster preload helper that avoids a quadratic link scan and encoding intermediate source maps, more resilient dev-server HMR (file watcher errors no longer crash the server, restart requests issued during a restart are no longer dropped, new `import.meta.hot.acceptExports` support), correct CSS preloads when `renderBuiltUrl` returns URLs with queries or a non-root base is enabled, and assorted rolldown-option merge and dependency-optimizer fixes
  - **Go** (#148) — bumped from `1.27.1` to `1.27.2` in Dockerfile, `go.mod`, and CI, taking in security fixes to the `go` command and the `crypto/tls`, `html/template`, `net/http`, `net/textproto`, and `os` packages, and bug fixes to the compiler, the linker, the runtime, the `cover` tool, `go fix`, vet, and the `compress/flate`, `crypto/mlkem`, `encoding/json`, `encoding/json/v2`, `net/http`, and `os` packages
license: mit
wrapper-repo: "https://github.com/sudocarlos/tailrelay-startos"
upstream-repo: "https://github.com/sudocarlos/tailrelay"
support-site: "https://github.com/sudocarlos/tailrelay/issues"
marketing-site: "https://github.com/sudocarlos/tailrelay"
donation-url: null
build: ["make"]
min-os-version: 0.3.5
description:
  short: Expose local services to your Tailscale network with automatic TLS, HTTP proxies, and TCP relays.
  long: |
    Tailrelay combines Tailscale VPN, Caddy reverse proxy, socat TCP relays, and a Web UI for browser-based management.
    Securely access self-hosted services like BTCPayServer, LND, electrs, and Mempool without Tor.
    Features automatic HTTPS certificates via Tailscale, protocol support for both HTTP/HTTPS proxies and raw TCP relays,
    and backup/restore functionality.
assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md
  docker-images: image.tar
main:
  type: docker
  image: main
  entrypoint: docker_entrypoint.sh
  args: []
  mounts:
    main: /data
    tailscale: /var/lib/tailscale
  io-format: yaml
health-checks:
  web-ui:
    name: Web UI
    success-message: Tailrelay Web UI is ready to be visited in your browser.
    type: script
properties:
  type: script
volumes:
  main:
    type: data
  tailscale:
    type: data
interfaces:
  main:
    name: User Interface
    description: Tailrelay Web UI
    tor-config:
      port-mapping:
        80: "8021"
    lan-config:
      443:
        ssl: true
        internal: 8021
    ui: true
    protocols:
      - tcp
      - http
dependencies: {}
actions: {}
alerts: {}
backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - create
      - /mnt/backup
      - /data
      - /var/lib/tailscale
    mounts:
      BACKUP: /mnt/backup
      main: /data
      tailscale: /var/lib/tailscale
    io-format: yaml
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /data
      - /var/lib/tailscale
    mounts:
      BACKUP: /mnt/backup
      main: /data
      tailscale: /var/lib/tailscale
    io-format: yaml
migrations:
  from:
    "*":
      type: script
      args: ["from"]
  to:
    "*":
      type: script
      args: ["to"]
