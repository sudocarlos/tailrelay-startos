id: tailrelay
title: Tailrelay
version: 0.12.1
release-notes: |-
  ### Changed
  - **Tailscale** (#166) — bumped from `v1.104.2` to `v1.104.4` in Dockerfile, collecting the v1.104.4 security release (v1.104.3 was an internal-only release): Tailscale SSH runs Unix-socket forwarding as the authenticated user instead of `root`, so authorized peers can no longer reach root-only sockets such as the Docker socket or the `tailscaled` local API (TS-2026-014); Tailscale SSH bounds per-session memory and releases it on disconnect, preventing denial of service from continuous window-change messages and environment appends (TS-2026-015); Tailscale Serve restricts TCP forwards to Unix socket backends and revalidates backend paths on each connection, blocking access to privileged sockets (TS-2026-016); and Serve derives per-request capabilities from the request context instead of one shared across all HTTP/2 streams, so `Tailscale-App-Capabilities` no longer leak between mounts (TS-2026-017)
  - **Node.js** (#164) — bumped from `24.22.1` to `24.22.2` in Dockerfile and CI, taking in the v24.22.2 patch release: the upstream V8 stack-trace work (cheaper summarization of optimized frames, deferred CallSiteInfo creation, a Wasm call-site fix, and an integer overflow in `Error.stackTraceLimit` trimming that crashed or silently dropped frames with `--trace-uncaught` or an attached debugger) and a stream fix that keeps the async context of parked writes until they execute
license: mit
wrapper-repo: "https://github.com/sudocarlos/tailrelay-startos"
upstream-repo: "https://github.com/sudocarlos/tailrelay"
support-site: "https://github.com/sudocarlos/tailrelay/issues"
marketing-site: "https://github.com/sudocarlos/tailrelay"
donation-url: null
build: ["make"]
min-os-version: 0.3.5
description:
  short: Expose local services to your Tailscale network with automatic TLS, HTTP proxies, and TCP relays.
  long: |
    Tailrelay combines Tailscale VPN, Caddy reverse proxy, socat TCP relays, and a Web UI for browser-based management.
    Securely access self-hosted services like BTCPayServer, LND, electrs, and Mempool without Tor.
    Features automatic HTTPS certificates via Tailscale, protocol support for both HTTP/HTTPS proxies and raw TCP relays,
    and backup/restore functionality.
assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md
  docker-images: image.tar
main:
  type: docker
  image: main
  entrypoint: docker_entrypoint.sh
  args: []
  mounts:
    main: /data
    tailscale: /var/lib/tailscale
  io-format: yaml
health-checks:
  web-ui:
    name: Web UI
    success-message: Tailrelay Web UI is ready to be visited in your browser.
    type: script
properties:
  type: script
volumes:
  main:
    type: data
  tailscale:
    type: data
interfaces:
  main:
    name: User Interface
    description: Tailrelay Web UI
    tor-config:
      port-mapping:
        80: "8021"
    lan-config:
      443:
        ssl: true
        internal: 8021
    ui: true
    protocols:
      - tcp
      - http
dependencies: {}
actions: {}
alerts: {}
backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - create
      - /mnt/backup
      - /data
      - /var/lib/tailscale
    mounts:
      BACKUP: /mnt/backup
      main: /data
      tailscale: /var/lib/tailscale
    io-format: yaml
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /data
      - /var/lib/tailscale
    mounts:
      BACKUP: /mnt/backup
      main: /data
      tailscale: /var/lib/tailscale
    io-format: yaml
migrations:
  from:
    "*":
      type: script
      args: ["from"]
  to:
    "*":
      type: script
      args: ["to"]
