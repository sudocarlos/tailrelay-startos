id: tailrelay
title: Tailrelay
version: 0.11.0
release-notes: |
  ### Added

  - **Per-relay icon** (#103) - relays (TCP, HTTPS, funnel) now accept an optional `icon_url` rendered on the relay card in place of the default glyph, with status conveyed by a small corner dot so the icon stays readable. Accepts an `http`/`https` URL or a capped (256 KiB) `data:image/*` URI; other schemes (e.g. `javascript:`) are rejected with `400`. Persisted on `ServeRelay` (`serve_relays.json` / covered by backups) and optional on `targets.json` presets.
  - **Favicon auto-suggest** (#103) - the Add/Edit modal now suggests the target's `favicon.ico` on blur of the target field for web transports (HTTPS relay and funnel-HTTPS), plus explicit "Favicon" and "Clear" buttons. Favicon requests go straight from the browser with `referrerpolicy="no-referrer"` so the MagicDNS URL isn't leaked to the target host; no third-party favicon services are used.

  ### Changed

  - **OpenAPI** - documented `icon_url` on serve relays and preset targets in `docs/openapi.yaml` (#103).
license: mit
wrapper-repo: "https://github.com/sudocarlos/tailrelay-startos"
upstream-repo: "https://github.com/sudocarlos/tailrelay"
support-site: "https://github.com/sudocarlos/tailrelay/issues"
marketing-site: "https://github.com/sudocarlos/tailrelay"
donation-url: null
build: ["make"]
min-os-version: 0.3.5
description:
  short: Expose local services to your Tailscale network with automatic TLS, HTTP proxies, and TCP relays.
  long: |
    Tailrelay combines Tailscale VPN, Caddy reverse proxy, socat TCP relays, and a Web UI for browser-based management.
    Securely access self-hosted services like BTCPayServer, LND, electrs, and Mempool without Tor.
    Features automatic HTTPS certificates via Tailscale, protocol support for both HTTP/HTTPS proxies and raw TCP relays,
    and backup/restore functionality.
assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md
  docker-images: image.tar
main:
  type: docker
  image: main
  entrypoint: docker_entrypoint.sh
  args: []
  mounts:
    main: /data
    tailscale: /var/lib/tailscale
  io-format: yaml
health-checks:
  web-ui:
    name: Web UI
    success-message: Tailrelay Web UI is ready to be visited in your browser.
    type: script
properties:
  type: script
volumes:
  main:
    type: data
  tailscale:
    type: data
interfaces:
  main:
    name: User Interface
    description: Tailrelay Web UI
    tor-config:
      port-mapping:
        80: "8021"
    lan-config:
      443:
        ssl: true
        internal: 8021
    ui: true
    protocols:
      - tcp
      - http
dependencies: {}
actions: {}
alerts: {}
backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - create
      - /mnt/backup
      - /data
      - /var/lib/tailscale
    mounts:
      BACKUP: /mnt/backup
      main: /data
      tailscale: /var/lib/tailscale
    io-format: yaml
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /data
      - /var/lib/tailscale
    mounts:
      BACKUP: /mnt/backup
      main: /data
      tailscale: /var/lib/tailscale
    io-format: yaml
migrations:
  from:
    "*":
      type: script
      args: ["from"]
  to:
    "*":
      type: script
      args: ["to"]
